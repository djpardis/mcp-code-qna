[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-code-qna"
version = "0.2.0"
description = "MCP-style server that answers questions about a local Python code repository."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "djpardis" }]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.4,<3",
    "sentence-transformers>=2.2,<3",
    "faiss-cpu>=1.7,<2",
    "spacy>=3.7,<3.8",
    "textblob>=0.17,<1",
    "numpy>=1.22",
    "requests>=2.28",
]

[project.optional-dependencies]
eval = ["matplotlib>=3.6"]

[project.scripts]
mcp-server = "app.mcp_web_server:main"
mcp-ask = "app.cli:main"

[project.urls]
Homepage = "https://github.com/djpardis/mcp-code-qna"

[tool.setuptools.packages.find]
include = ["app*"]
